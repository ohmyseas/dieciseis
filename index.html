<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dieciséis v2 · Spanish, the 16-lesson way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#1C2B26; --board2:#24362F; --board3:#2C4139; --line:#3A5248;
  --chalk:#F1EFE6; --muted:#93A79D; --saffron:#F2B441; --azul:#6FB8D6;
  --rojo:#E2694F; --verde:#7FC98B; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--board);color:var(--chalk);font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.5;
background-image:radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.03), transparent 55%);}
#app{max-width:760px;margin:0 auto;padding:0 16px 90px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:0;background:var(--board);z-index:10;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.brand h1{font-weight:900;font-stretch:110%;font-size:22px;letter-spacing:.5px;color:var(--saffron)}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.top-actions{display:flex;gap:8px}
.chip{font-size:12px;letter-spacing:.06em;padding:12px 12px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);color:var(--chalk);background:var(--board2);transition:background .15s}
.chip:hover{background:var(--board3)}
.chip.on{background:var(--saffron);color:#1C2B26;border-color:var(--saffron);font-weight:700}
.hero{margin:6px 0 22px}
.hero h2{font-weight:900;font-stretch:115%;font-size:clamp(28px,6vw,40px);line-height:1.08}
.hero h2 em{font-style:normal;color:var(--saffron)}
.hero p{color:var(--muted);margin-top:10px;max-width:56ch;font-size:15px}
.progress-line{margin:16px 0 4px;font-size:13px;color:var(--muted)}
.progress-track{height:6px;background:var(--board2);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--saffron),var(--verde));width:0%;transition:width .4s}
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
@media(max-width:520px){.grid16{grid-template-columns:repeat(2,1fr)}}
.cell{background:var(--board2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .12s,background .15s;position:relative;overflow:hidden}
.cell:hover{background:var(--board3);transform:translateY(-2px)}
.cell .num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--saffron)}
.cell .t{font-weight:700;font-size:14px;line-height:1.25;margin-top:6px}
.cell .s{font-size:11px;color:var(--muted);margin-top:4px}
.cell .done-mark{position:absolute;top:10px;right:12px;font-size:13px;color:var(--verde)}
.tools-row{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.tool-btn{flex:1;min-width:200px;background:var(--board2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;transition:background .15s}
.tool-btn:hover{background:var(--board3)}
.tool-btn .tt{font-weight:800;color:var(--azul);font-size:15px}
.tool-btn .ts{font-size:12.5px;color:var(--muted);margin-top:4px}
.crumb{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-size:13px;color:var(--muted)}
.crumb button{color:var(--azul);font-size:13px}
.lesson-head h2{font-weight:900;font-stretch:112%;font-size:clamp(22px,5vw,30px)}
.lesson-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.tabs{display:flex;gap:6px;margin:18px 0 16px;border-bottom:1px solid var(--line)}
.tab{padding:12px 14px;min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--saffron);border-bottom-color:var(--saffron)}
.note{background:var(--board2);border:1px solid var(--line);border-left:3px solid var(--azul);border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;font-size:14.5px;margin-bottom:16px}
.note b{color:var(--azul)}
.matrix{background:var(--board2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.matrix h4{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--saffron);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.matrix table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:14.5px}
.matrix td{padding:7px 8px;border-bottom:1px dashed var(--line)}
.matrix tr:last-child td{border-bottom:none}
.matrix td.pron{color:var(--muted);width:44%}
.matrix td.form{color:var(--chalk);font-weight:600}
.vocab-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
@media(max-width:520px){.vocab-list{grid-template-columns:1fr}}
.vword{background:var(--board2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;transition:background .12s}
.vword .es{font-weight:700}
.vword .tr{color:var(--muted);font-size:12.5px;text-align:right}
.drill-card{background:var(--board2);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.drill-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.drill-task{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rojo)}
.drill-prompt{font-size:clamp(18px,4.2vw,23px);font-weight:700;line-height:1.35;white-space:pre-line}
.drill-hint{font-size:14px;color:var(--muted);white-space:pre-line}
.drill-answer{font-size:clamp(18px,4.2vw,24px);font-weight:800;color:var(--saffron);font-family:'IBM Plex Mono',monospace;line-height:1.4;white-space:pre-line}
.drill-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:12px;font-size:15px;font-weight:700;background:var(--board3);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--saffron);color:#1C2B26;border-color:var(--saffron)}
.btn.good{background:var(--verde);color:#14231A;border-color:var(--verde)}
.btn.again{background:var(--board2);color:var(--rojo);border-color:var(--rojo)}
.btn.small{padding:8px 14px;font-size:13px}
.drill-done{text-align:center;padding:36px 16px;background:var(--board2);border:1px solid var(--line);border-radius:var(--radius)}
.drill-done h3{color:var(--verde);font-size:22px;font-weight:900}
.drill-done p{color:var(--muted);font-size:14px;margin-top:6px}
/* tiles */
.tile-zone{min-height:56px;background:var(--board3);border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.tile-zone.answer{border-style:solid;border-color:var(--saffron)}
.tile-zone.correct-zone{border-color:var(--verde)}
.tile-zone.wrong-zone{border-color:var(--rojo);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tile{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;padding:9px 13px;border-radius:9px;background:var(--board);border:1px solid var(--line);transition:transform .1s}
.tile:active{transform:scale(.95)}
.tile.in-answer{background:var(--board2);border-color:var(--saffron)}
.zone-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:14px;text-align:left}
.q-question{font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.35}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{text-align:left;padding:13px 15px;border-radius:12px;background:var(--board2);border:1px solid var(--line);font-size:15.5px;font-family:'IBM Plex Mono',monospace;transition:background .12s}
.q-opt:hover{background:var(--board3)}
.q-opt.correct{background:rgba(127,201,139,.16);border-color:var(--verde);color:var(--verde)}
.q-opt.wrong{background:rgba(226,105,79,.14);border-color:var(--rojo);color:var(--rojo)}
.q-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:12px}
.q-result{text-align:center;padding:34px 16px;background:var(--board2);border:1px solid var(--line);border-radius:var(--radius)}
.q-result .score{font-size:44px;font-weight:900;color:var(--saffron);font-family:'IBM Plex Mono',monospace}
.q-result p{color:var(--muted);font-size:14px;margin-top:6px}
.q-result .btn{margin-top:18px}
.vm-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.vm-grid{background:var(--board2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.vm-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.vm-row:last-child{border-bottom:none}
.vm-pron{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:14.5px}
.vm-cell{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;padding:6px 14px;border-radius:9px;background:var(--board3);border:1px solid var(--line);min-width:130px;text-align:center}
.vm-cell.hidden-cell{color:transparent;text-shadow:0 0 12px rgba(241,239,230,.55);cursor:pointer}
.vm-cell.revealed{color:var(--saffron)}
.vm-search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--board2);color:var(--chalk);font-size:15px;margin-bottom:14px;font-family:inherit}
.vm-search:focus{outline:none;border-color:var(--saffron)}
.vm-cat-header{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--saffron);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.vm-verb-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:12px}
@media(max-width:520px){.vm-verb-list{grid-template-columns:1fr}}
.vm-verb-item{display:flex;flex-direction:column;background:var(--board2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;transition:background .12s,transform .1s}
.vm-verb-item:hover{background:var(--board3)}
.vm-verb-item:active{transform:scale(.98)}
.vm-verb-item .es{font-weight:700;font-size:15px;color:var(--chalk)}
.vm-verb-item .en{font-size:12px;color:var(--muted);margin-top:2px}
.vm-empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
.vm-back{color:var(--azul);font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--board2);margin-bottom:14px}
.vm-verb-title{font-size:24px;font-weight:900;color:var(--saffron)}
.vm-verb-en{font-size:14px;color:var(--muted);margin-top:2px}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.footer-tip{margin-top:34px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>

// Derive Conditional from Future: same stem, different endings
// Future endings: -é, -ás, -á, -emos, -éis, -án
// Conditional endings: -ía, -ías, -ía, -íamos, -íais, -ían
(function deriveConditional(){
  const futEnd = ["é","ás","á","emos","éis","án"];
  const condEnd = ["ía","ías","ía","íamos","íais","ían"];
  Object.keys(VERBS).forEach(v=>{
    const fut = VERBS[v].future;
    if(!fut || fut.length!==6) return;
    VERBS[v].conditional = fut.map((form,i)=>{
      const ending = futEnd[i];
      if(form.endsWith(ending)){
        return form.slice(0, -ending.length) + condEnd[i];
      }
      return form; // fallback if unexpected
    });
  });
})();

/* Persistence: window.storage inside Claude artifacts, localStorage when
   deployed as a normal website (Vercel/GitHub Pages), memory-only as last resort. */
const hasClaudeStorage = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
async function loadState(){
  let raw=null;
  try{
    if(hasClaudeStorage){ const r=await window.storage.get(PKEY); raw=r&&r.value; }
    else{ raw=localStorage.getItem(PKEY); }
  }catch(e){/* first run or storage unavailable */}
  if(raw){
    try{ const d=JSON.parse(raw);
      progress=d.progress||{}; scores=d.scores||{}; ruHints=d.ruHints!==false; tiles=d.tiles!==false;
      formsScores = d.formsScores || {}; formsHideSecondary = d.formsHideSecondary === true;
    }catch(e){}
  }
}
async function saveState(){
  const raw=JSON.stringify({progress,scores,ruHints,tiles,formsScores,formsHideSecondary});
  try{
    if(hasClaudeStorage){ await window.storage.set(PKEY,raw); }
    else{ localStorage.setItem(PKEY,raw); }
  }catch(e){console.error("save failed",e);}
}

function toast(msg, isError){
  let el = document.getElementById("tts-toast");
  if(!el){
    el = document.createElement("div");
    el.id = "tts-toast";
    el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--board3);color:var(--chalk);padding:12px 20px;border-radius:10px;border:1px solid var(--line);z-index:2000;font-size:14px;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .3s";
    document.body.appendChild(el);
  }
  el.style.borderColor = isError ? "var(--rojo)" : "var(--verde)";
  el.style.color = isError ? "var(--rojo)" : "var(--chalk)";
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(el._t);
  el._t = setTimeout(()=>{el.style.opacity="0";}, 3500);
}

async function speak(text){
  if(!text) return;
  if(!ttsKey){
    toast("Tap the 🔊 button in the top bar to add your ElevenLabs API key.", true);
    return;
  }
  const clean = String(text).replace(/[¿¡]/g,"").trim();
  if(!clean) return;
  if(audioCache[clean]){
    new Audio(audioCache[clean]).play().catch(e=>toast("Browser blocked audio. Tap again.",true));
    return;
  }
  try{
    console.log("[TTS] Sending:", clean, "voiceId:", VOICE_ID, "keyPrefix:", ttsKey.slice(0,6)+"...");
    const r = await fetch("/api/speak",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:clean,apiKey:ttsKey,voiceId:VOICE_ID})
    });
    console.log("[TTS] Response status:", r.status);
    if(!r.ok){
      let body = "";
      try{ body = await r.text(); }catch(e){}
      console.error("[TTS] Full error body:", body);
      // Try to parse error message from ElevenLabs
      let userMsg = "HTTP " + r.status;
      try{
        const j = JSON.parse(body);
        if(j.error){
          // Nested ElevenLabs error
          const inner = typeof j.error === "string" ? j.error : JSON.stringify(j.error);
          const parsed = inner.match(/"message":"([^"]+)"/);
          userMsg = parsed ? parsed[1] : inner.slice(0, 200);
        }
      }catch(e){ userMsg = body.slice(0, 200) || ("HTTP " + r.status); }
      toast("TTS error: " + userMsg, true);
      return;
    }
    const blob = await r.blob();
    console.log("[TTS] Got audio blob, size:", blob.size, "type:", blob.type);
    const url = URL.createObjectURL(blob);
    audioCache[clean] = url;
    const audio = new Audio(url);
    audio.play().then(()=>console.log("[TTS] Playing")).catch(e=>{
      console.error("[TTS] Autoplay blocked:", e);
      toast("Browser blocked audio. Tap the sound button again.", true);
    });
  }catch(e){
    console.error("[TTS] Network error:", e);
    toast("Network error: " + e.message, true);
  }
}

const TENSE_MAP = {pres:"present",pret:"preterite",imp:"imperfect",fut:"future"};

function matrixHTML(t){

/* ---------- drill engine ---------- */
let deck=[],deckIdx=0,deckMode="lesson",revealed=false,deckTotal=0;
let tileState=null; // {answer:[], bank:[], solved:bool, wrong:bool}

function startDrill(items,mode){
  deck=[...items];
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  deckIdx=0;deckMode=mode;revealed=false;deckTotal=deck.length;tileState=null;
  renderDrill();
}
function drillHeader(){
  const L=LESSONS[curLesson];
  return deckMode==="lesson"
   ? `<div class="crumb"><button onclick="goHome()">← All lessons</button><span>Lesson ${curLesson+1} of 16</span></div>
      <div class="lesson-head"><h2>${L.title}</h2><div class="sub">${L.sub}</div></div>
      <div class="tabs"><button class="tab" onclick="setTab('learn')">Learn</button><button class="tab on">Drill</button><button class="tab" onclick="setTab('quiz')">Check</button></div>`
   : `<div class="crumb"><button onclick="goHome()">← Home</button><span>Mixed review</span></div>`;
}
function tokenize(es){
  return es.replace(/[¿?¡!.,—:;]/g," ").split(/\s+/).filter(w=>w.length);
}
function initTiles(c){
  const words=tokenize(c.es);
  const inSet=new Set(words.map(w=>w.toLowerCase()));
  const pool=DISTRACTORS.filter(d=>!inSet.has(d));
  const extra=[];
  while(extra.length<2&&pool.length){extra.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
  const bank=[...words,...extra].map((w,id)=>({w,id}));
  for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]];}
  tileState={target:words,answer:[],bank,solved:false,wrong:false};
}
function renderDrill(){
  rerender=renderDrill;
  if(deckIdx>=deck.length){
    if(deckMode==="lesson"){progress[curLesson]=progress[curLesson]||{};progress[curLesson].drills=true;saveState();}
    h(`${topbar()}${drillHeader()}
    <div class="drill-done"><h3>¡Muy bien!</h3><p>${deckTotal} sentences drilled.</p>
    <div class="drill-actions">
      <button class="btn" onclick="${deckMode==='lesson'?`startDrill(lessonDeck(curLesson),'lesson')`:`renderReview()`}">Run it again</button>
      ${deckMode==="lesson"?`<button class="btn primary" onclick="setTab('quiz')">Take the check →</button>`:`<button class="btn primary" onclick="goHome()">Home</button>`}
    </div></div>`);
    return;
  }
  const c=deck[deckIdx];
  const useTiles = tiles && !c.dlg;
  if(useTiles && !tileState) initTiles(c);
  const taskLine = c.task?`<div class="drill-task">${c.task}</div>`:"";
  let body="";
  if(useTiles){
    const ansTiles=tileState.answer.map((t,i)=>`<button class="tile in-answer" onclick="tileBack(${i})">${esc(t.w)}</button>`).join("")||`<span style="color:var(--muted);font-size:13px">tap tiles below to build the sentence</span>`;
    const bankTiles=tileState.bank.map((t,i)=>`<button class="tile" onclick="tilePick(${i})">${esc(t.w)}</button>`).join("");
    const zoneClass=tileState.solved?"correct-zone":(tileState.wrong?"wrong-zone":"");
    body=`<div class="drill-card">
      <div class="drill-count">${deckIdx+1} / ${deck.length}</div>${taskLine}
      <div class="drill-prompt">${esc(c.en)}</div>
      ${ruHints?`<div class="drill-hint">${esc(c.ru)}</div>`:""}
      ${tileState.solved?`<div class="drill-answer">${esc(c.es)}</div>`:""}
    </div>
    <div class="zone-label">Your sentence</div>
    <div class="tile-zone answer ${zoneClass}">${ansTiles}</div>
    ${tileState.solved?"":`<div class="zone-label">Tiles</div><div class="tile-zone">${bankTiles}</div>`}
    <div class="drill-actions">
      ${tileState.solved
        ? `<button class="btn small" onclick="speak(deck[deckIdx].es)">🔊 Hear it</button>
           <button class="btn good" onclick="advanceDrill()">Next ✓</button>`
        : `<button class="btn primary" onclick="checkTiles()">Check</button>
           <button class="btn small" onclick="revealTiles()">Give up — show it</button>`}
    </div>`;
  }else{
    body=`<div class="drill-card">
      <div class="drill-count">${deckIdx+1} / ${deck.length}</div>${taskLine}
      <div class="drill-prompt">${esc(c.en)}</div>
      ${ruHints?`<div class="drill-hint">${esc(c.ru)}</div>`:""}
      ${revealed?`<div class="drill-answer">${esc(c.es)}</div>`:""}
    </div>
    <div class="drill-actions">
      ${revealed
        ? `<button class="btn small" onclick="speak(deck[deckIdx].es)">🔊 Hear it</button>
           <button class="btn good" onclick="gradeDrill(true)">Got it ✓</button>
           <button class="btn again" onclick="gradeDrill(false)">Again ↻</button>`
        : `<button class="btn primary" onclick="revealDrill()">Say it aloud, then reveal</button>`}
    </div>`;
  }
  h(`${topbar()}${drillHeader()}${body}`);
}
function tilePick(i){
  console.log('[DEBUG] tilePick called with index:', i);
  if(!tileState){
    console.error('[ERROR] tileState is null');
    return;
  }
  if(i<0||i>=tileState.bank.length){
    console.error('[ERROR] Invalid tile index:', i, 'bank length:', tileState.bank.length);
    return;
  }
  const t=tileState.bank.splice(i,1)[0];
  console.log('[DEBUG] Picked tile:', t.w);
  tileState.answer.push(t);tileState.wrong=false;renderDrill();
}
function tileBack(i){
  console.log('[DEBUG] tileBack called with index:', i);
  if(!tileState){
    console.error('[ERROR] tileState is null');
    return;
  }
  if(i<0||i>=tileState.answer.length){
    console.error('[ERROR] Invalid tile index:', i, 'answer length:', tileState.answer.length);
    return;
  }
  const t=tileState.answer.splice(i,1)[0];
  console.log('[DEBUG] Returned tile to bank:', t.w);
  tileState.bank.push(t);tileState.wrong=false;renderDrill();
}
function norm(w){return w.toLowerCase();}
function advanceDrill(){
  deckIdx++;revealed=false;tileState=null;renderDrill();
}
function checkTiles(){
  const got=tileState.answer.map(t=>norm(t.w));
  const want=tileState.target.map(norm);
  const ok=got.length===want.length&&got.every((w,i)=>w===want[i]);
  const c=deck[deckIdx];
  if(ok){
    tileState.solved=true;
    if(c._l!==undefined && !tileState.penalized)bumpScore(c._l,c._d,+1);
    saveState();speak(c.es);
  }else{
    tileState.wrong=true;
    if(c._l!==undefined && !tileState.penalized){bumpScore(c._l,c._d,-1);tileState.penalized=true;}
    saveState();
  }
  renderDrill();
}
function revealTiles(){
  tileState.solved=true;
  tileState.penalized=true;   // no points for copying the shown answer
  const c=deck[deckIdx];
  if(c._l!==undefined)bumpScore(c._l,c._d,-1);
  saveState();
  deck.push(c);               // give-ups come back this session
  speak(c.es);
  renderDrill();
}
function revealDrill(){revealed=true;speak(deck[deckIdx].es);renderDrill();}
function gradeDrill(ok){
  const c=deck[deckIdx];
  if(c._l!==undefined)bumpScore(c._l,c._d,ok?+1:-1);
  if(!ok)deck.push(c);
  deckIdx++;revealed=false;tileState=null;saveState();renderDrill();
}

let qIdx=0,qScore=0,qLocked=false;
function startQuiz(){qIdx=0;qScore=0;qLocked=false;renderQuiz();}
function renderQuiz(){
  rerender=renderQuiz;
  const L=LESSONS[curLesson];
  const head=`<div class="crumb"><button onclick="goHome()">← All lessons</button><span>Lesson ${curLesson+1} of 16</span></div>
  <div class="lesson-head"><h2>${L.title}</h2><div class="sub">${L.sub}</div></div>
  <div class="tabs"><button class="tab" onclick="setTab('learn')">Learn</button><button class="tab" onclick="setTab('drill')">Drill</button><button class="tab on">Check</button></div>`;
  if(qIdx>=L.quiz.length){
    const passed=qScore>=Math.ceil(L.quiz.length*0.75);
    progress[curLesson]=progress[curLesson]||{};
    if(!progress[curLesson].quizBest||qScore>progress[curLesson].quizBest)progress[curLesson].quizBest=qScore;
    saveState();
    h(`${topbar()}${head}
    <div class="q-result"><div class="score">${qScore} / ${L.quiz.length}</div>
    <p>${passed?"Lesson passed — the algorithm is yours.":"Below 75% — run the drill once more, then retake."}</p>
    <div class="drill-actions">
      <button class="btn" onclick="startQuiz()">Retake</button>
      ${passed&&curLesson<15?`<button class="btn primary" onclick="openLesson(${curLesson+1})">Next lesson →</button>`:`<button class="btn primary" onclick="goHome()">Home</button>`}
    </div></div>`);
    return;
  }
  const Q=L.quiz[qIdx];
  const sh=Q.opts.map((o,i)=>({o,i}));
  const seed=(curLesson*7+qIdx*13)%4;
  for(let k=0;k<seed;k++)sh.push(sh.shift());
  const opts=sh.map(({o,i})=>`<button class="q-opt" data-i="${i}" onclick="answerQuiz(${i},${Q.a})">${esc(o)}</button>`).join("");
  h(`${topbar()}${head}
  <div class="q-meta">Question ${qIdx+1} / ${L.quiz.length}</div>
  <div class="q-question">${esc(Q.q)}</div>
  <div class="q-opts">${opts}</div>`);
  qLocked=false;
}
function answerQuiz(chosen,correct){
  if(qLocked)return;qLocked=true;
  document.querySelectorAll(".q-opt").forEach(b=>{
    const i=+b.dataset.i;
    if(i===correct)b.classList.add("correct");
    else if(i===chosen)b.classList.add("wrong");
  });
  if(chosen===correct)qScore++;
  setTimeout(()=>{qIdx++;renderQuiz();},900);
}

      <div style="display:flex;gap:6px;align-items:center">
        <button class="vm-cell ${rev?'revealed':'hidden-cell'}" onclick="vmToggle(${i})">${f[i]}</button>
        <button class="chip" style="min-height:36px;padding:6px 10px;font-size:13px" onclick="speak('${form}')" title="Play audio">🔊</button>
      </div>
    </div>`;
  }).join("");
  const sentenceForm = f.join(", ");
  h(`${topbar()}
  <div class="crumb"><button onclick="vmBack()">← Back to verb list</button></div>
  <div class="lesson-head"><div class="vm-verb-title">${vmVerb}</div><div class="vm-verb-en">${meta.en}</div></div>
  <div class="section-label">Tense · Tiempo — ${currentTenseLabel}</div>
  <div class="vm-controls">${tenseBtns}</div>
  <div class="vm-grid">${rows}</div>
  <div class="drill-actions">
    <button class="btn" onclick="vmHideAll()">Hide all</button>
    <button class="btn primary" onclick="vmShowAll()">Reveal all</button>
    <button class="btn small" onclick="speak('${sentenceForm.replace(/'/g,"\\'")}')">🔊 Play all forms</button>
  </div>`);
}
function vmSetFilter(v){vmFilter=v;renderVMList();}
function vmSetCat(c){vmCat=c;renderVMList();}
function vmPick(v){vmVerb=v;vmTense="present";vmRevealed=new Set();renderVMTable();}
function vmBack(){vmVerb=null;vmRevealed=new Set();renderVMList();}
function vmSetTense(t){vmTense=t;vmRevealed=new Set();renderVMTable();}
function vmToggle(i){if(vmRevealed.has(i)){vmRevealed.delete(i);}else{vmRevealed.add(i);speak(VERBS[vmVerb][vmTense][i]);}renderVMTable();}
function vmHideAll(){vmRevealed=new Set();renderVMTable();}
function vmShowAll(){vmRevealed=new Set([0,1,2,3,4,5]);renderVMTable();}

/* ---------- forms trainer ---------- */
let formsDeck=[],formsIdx=0;

function renderFormsTrainer(){
  rerender = renderFormsTrainer;
  const head = `<div class="crumb"><button onclick="goHome()">← Home</button><span>7-Forms Trainer</span></div>
  <div class="lesson-head"><h2>7-Forms Trainer</h2><div class="sub">Pick the tense, then conjugate</div></div>`;

  h(`${topbar()}${head}
  <div class="section-label">Hide secondary forms (Conditional, Pluperfect)</div>
  <div class="vm-controls">
    <button class="chip ${formsHideSecondary?'on':''}" onclick="toggleFormsSecondary()">Secondary Off</button>
  </div>
  <div class="drill-actions"><button class="btn primary" onclick="startFormsDrill()">Start Drill →</button></div>`);
}
function toggleFormsSecondary(){
  formsHideSecondary = !formsHideSecondary;
  saveState();
  renderFormsTrainer();
}
function renderFormsDrill(){
  rerender = renderFormsDrill;
  if(formsIdx >= formsDeck.length){
    const score = Object.values(formsScores).filter(v=>v>0).length;
    h(`${topbar()}
    <div class="crumb"><button onclick="goHome()">← Home</button><span>7-Forms Trainer</span></div>
    <div class="drill-done"><h3>¡Muy bien!</h3><p>${formsDeck.length} scenarios drilled.</p>
    <div class="drill-actions">
      <button class="btn" onclick="startFormsDrill()">Run again</button>
      <button class="btn primary" onclick="renderFormsTrainer()">Home</button>
    </div></div>`);
    return;
  }

  const scenario = formsDeck[formsIdx];
  const tenseKey = scenario.tense;
  const tenseName = FORM_TENSES[tenseKey].name;

  const tenseOptions = Object.entries(FORM_TENSES)
    .filter(([k,v]) => !formsHideSecondary || !['cond','plup'].includes(k))
    .map(([k,v]) => `<button class="chip" onclick="selectFormsTense('${k}')">${v.name}</button>`)
    .join("");

  h(`${topbar()}
  <div class="crumb"><button onclick="goHome()">← Home</button><span>7-Forms Trainer</span></div>
  <div class="lesson-head"><h2>7-Forms Trainer</h2><div class="sub">${formsIdx+1} / ${formsDeck.length}</div></div>
  <div class="drill-card">
    <div class="drill-prompt">${esc(scenario.english)}</div>
    ${ruHints?`<div class="drill-hint">${esc(scenario.ru)}</div>`:""}
  </div>
  <div class="section-label">Pick the tense</div>
  <div class="vm-controls">${tenseOptions}</div>
  <div class="drill-actions">
    <button class="btn small" onclick="skipFormsScenario()">Skip</button>
  </div>`);
}

function startFormsDrill(){
  const filtered = formsHideSecondary
    ? FORMS_SCENARIOS.filter(s=>!['cond','plup'].includes(s.tense))
    : FORMS_SCENARIOS;
  formsDeck = [...filtered];
  for(let i=formsDeck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [formsDeck[i],formsDeck[j]] = [formsDeck[j],formsDeck[i]];
  }
  formsIdx = 0;
  renderFormsDrill();
}

function selectFormsTense(chosenTenseKey){
  const scenario = formsDeck[formsIdx];
  const correct = chosenTenseKey === scenario.tense;

  const tenseName = FORM_TENSES[chosenTenseKey].name;
  const correctTense = FORM_TENSES[scenario.tense].name;

  if(correct){
    formsScores[scenario.tense] = (formsScores[scenario.tense]||0) + 1;
    h(`${topbar()}
    <div class="crumb"><button onclick="goHome()">← Home</button></div>
    <div class="drill-card">
      <div class="drill-prompt">${esc(scenario.english)}</div>
      <div class="drill-answer" style="color:var(--verde);">✓ Correct! ${correctTense}</div>
    </div>
    <div class="drill-actions">
      <button class="btn good" onclick="advanceFormsDrill()">Next →</button>
    </div>`);
  }else{
    formsScores[scenario.tense] = (formsScores[scenario.tense]||0) - 1;
    h(`${topbar()}
    <div class="crumb"><button onclick="goHome()">← Home</button></div>
    <div class="drill-card">
      <div class="drill-prompt">${esc(scenario.english)}</div>
      <div class="drill-answer" style="color:var(--rojo);">✗ Wrong. It's ${correctTense}</div>
    </div>
    <div class="drill-actions">
      <button class="btn again" onclick="renderFormsDrill()">Try again</button>
      <button class="btn small" onclick="advanceFormsDrill()">Next anyway</button>
    </div>`);
  }
  saveState();
}

function advanceFormsDrill(){
  formsIdx++;
  renderFormsDrill();
}

function skipFormsScenario(){
  formsIdx++;
  renderFormsDrill();
}

/* ---------- mixed review (weakness-weighted) ---------- */
function renderReview(){
  const opened=Object.keys(progress).map(Number);
  const src=opened.length?opened:[0];
  let pool=[];
  src.forEach(li=>{
    if(!LESSONS[li])return;
    LESSONS[li].drills.forEach((d,di)=>{
      const s=scores[scoreKey(li,di)]||0;
      const weight=6-s;                 // weak items weigh more
      pool.push({item:{...d,_l:li,_d:di},weight});
    });
  });
  const out=[];
  while(pool.length&&out.length<14){
    const total=pool.reduce((a,p)=>a+p.weight,0);
    let r=Math.random()*total;
    let idx=0;
    for(let i=0;i<pool.length;i++){r-=pool[i].weight;if(r<=0){idx=i;break;}}
    out.push(pool.splice(idx,1)[0].item);
  }
  startDrill(out,"review");
}

  });
</script>
